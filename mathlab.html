                    learnList.classList.toggle('open');
                };
            }

            // Learning Mode Practice Starters
            const startPractice = (mode) => {
                learnList.classList.remove('open');
                S.learnMode = mode;
                S.learnStreak = 0;
                S.learnShowHint = false;
                S.learnStartId = S.idC;

                // Hide all existing objects
                S.learnHiddenObjs = S.objs.filter(o => parseInt(o.id) < S.learnStartId && o.vis).map(o => o.id);
                S.learnHiddenObjs.forEach(id => {
                    const obj = getObj(id);
                    if (obj) obj.vis = false;
                });

                // Start analytics tracking
                Analytics.startLearningSession(mode);

                regenPractice();
                updateToggles();
                updateLearnUI();
                render();
            };

            const regenPractice = () => {
                // Cleanup objects created during previous attempt of same task
                S.objs = S.objs.filter(o => parseInt(o.id) < S.learnStartId);
                S.idC = S.learnStartId;
                S.learnShowHint = false;

                if (S.learnMode === 'pt') {
                    const tx = Math.floor(Math.random() * 11) - 5, ty = Math.floor(Math.random() * 11) - 5;
                    S.learnTarget = { x: tx, y: ty };
                    setTool('pt');
                } else if (S.learnMode === 'ln') {
                    const m = Math.floor(Math.random() * 5) - 2, n = Math.floor(Math.random() * 7) - 3;
                    const p1 = { x: 0, y: n }, p2 = { x: 1, y: n + m };
                    S.learnTarget = { m, n, p1, p2 };
                    setTool('ln');
                } else if (S.learnMode === 'cir') {
                    const cx = Math.floor(Math.random() * 9) - 4, cy = Math.floor(Math.random() * 9) - 4, r = Math.floor(Math.random() * 3) + 2;
                    const p1 = { x: cx, y: cy }, p2 = { x: cx + r, y: cy };
                    S.learnTarget = { cx, cy, r, p1, p2 };
                    setTool('cir');
                } else if (S.learnMode === 'par_ln') {
                    const px = Math.floor(Math.random() * 11) - 5, py = Math.floor(Math.random() * 11) - 5;
                    const x1 = Math.floor(Math.random() * 11) - 5, y1 = Math.floor(Math.random() * 11) - 5;
                    const x2 = x1 + (Math.random() > 0.5 ? 2 : -2), y2 = y1 + (Math.random() > 0.5 ? 2 : -2);
                    const pRef = createObj('pt', { x: px, y: py }); pRef.col = '#27ae60';
                    const pA = createObj('pt', { x: x1, y: y1 }); pA.vis = false;
                    const pB = createObj('pt', { x: x2, y: y2 }); pB.vis = false;
                    const lRef = createObj('ln', { p1: pA.id, p2: pB.id }); lRef.col = '#27ae60';
                    const g = M.getGeo(lRef);
                    S.learnTarget = { a: g.a, b: g.b, c: -(g.a * px + g.b * py) };
                    setTool('par_ln');
                } else if (S.learnMode === 'perp_ln') {
                    const px = Math.floor(Math.random() * 11) - 5, py = Math.floor(Math.random() * 11) - 5;
                    const x1 = Math.floor(Math.random() * 11) - 5, y1 = Math.floor(Math.random() * 11) - 5;
                    const x2 = x1 + (Math.random() > 0.5 ? 2 : -2), y2 = y1 + (Math.random() > 0.5 ? 2 : -2);
                    const pRef = createObj('pt', { x: px, y: py }); pRef.col = '#27ae60';
                    const pA = createObj('pt', { x: x1, y: y1 }); pA.vis = false;
                    const pB = createObj('pt', { x: x2, y: y2 }); pB.vis = false;
                    const lRef = createObj('ln', { p1: pA.id, p2: pB.id }); lRef.col = '#27ae60';
                    const g = M.getGeo(lRef);
                    S.learnTarget = { a: -g.b, b: g.a, c: g.b * px - g.a * py };
                    setTool('perp_ln');
                } else if (S.learnMode === 'mid') {
                    const x1 = Math.floor(Math.random() * 11) - 5, y1 = Math.floor(Math.random() * 11) - 5;
                    const x2 = x1 + (Math.random() > 0.5 ? 4 : -4), y2 = y1 + (Math.random() > 0.5 ? 4 : -4);
                    const p1 = createObj('pt', { x: x1, y: y1 }); p1.col = '#27ae60';
                    const p2 = createObj('pt', { x: x2, y: y2 }); p2.col = '#27ae60';
                    createObj('seg', { p1: p1.id, p2: p2.id }).col = '#27ae60';
                    S.learnTarget = { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
                    setTool('mid');
                } else if (S.learnMode === 'bis') {
                    const x2 = Math.floor(Math.random() * 7) - 3, y2 = Math.floor(Math.random() * 7) - 3;
                    const x1 = x2 + (Math.random() > 0.5 ? 4 : -4), y1 = y2 + (Math.random() > 0.5 ? 4 : -4);
                    const x3 = x2 + (Math.random() > 0.5 ? 4 : -4), y3 = y2 + (Math.random() > 0.5 ? 2 : -2);
                    const p1 = createObj('pt', { x: x1, y: y1 }); p1.col = '#27ae60', p2 = createObj('pt', { x: x2, y: y2 }); p2.col = '#27ae60', p3 = createObj('pt', { x: x3, y: y3 }); p3.col = '#27ae60';
                    createObj('seg', { p1: p1.id, p2: p2.id }).col = '#27ae60';
                    createObj('seg', { p1: p2.id, p2: p3.id }).col = '#27ae60';
                    const d1 = Math.hypot(x1 - x2, y1 - y2), d2 = Math.hypot(x3 - x2, y3 - y2), ux = (x1 - x2) / d1, uy = (y1 - y2) / d1, vx = (x3 - x2) / d2, vy = (y3 - y2) / d2, wx = ux + vx, wy = uy + vy, wl = Math.hypot(wx, wy);
                    if (wl < 1e-9) S.learnTarget = { a: ux, b: uy, c: -(ux * x2 + uy * y2) };
                    else { const dx = wx / wl, dy = wy / wl; S.learnTarget = { a: -dy, b: dx, c: dy * x2 - dx * y2 }; }
                    setTool('bis');
                }
                S.learnUserStartId = S.idC;
            };
            window.regenPractice = regenPractice;

            bLearnPt.onclick = (e) => { e.stopPropagation(); startPractice('pt'); };
            bLearnLn.onclick = (e) => { e.stopPropagation(); startPractice('ln'); };
            bLearnCir.onclick = (e) => { e.stopPropagation(); startPractice('cir'); };
            bLearnParLn.onclick = (e) => { e.stopPropagation(); startPractice('par_ln'); };
            bLearnPerpLn.onclick = (e) => { e.stopPropagation(); startPractice('perp_ln'); };
            bLearnMid.onclick = (e) => { e.stopPropagation(); startPractice('mid'); };
            bLearnBis.onclick = (e) => { e.stopPropagation(); startPractice('bis'); };

            window.updateLearnUI = () => {
                if (!S.learnMode) {
                    msg.style.display = 'none';
                    return;
                }
                msg.style.display = 'block';
                if (S.learnMode === 'pt') {
                    const t = S.learnTarget;
                    msg.innerText = S.lang === 'KO' ?
                        `좌표 (${t.x}, ${t.y})에 점을 찍으세요.` :
                        `Place a point at (${t.x}, ${t.y}).`;
                } else if (S.learnMode === 'ln') {
                    const t = S.learnTarget;
                    let eq = "y = ";
                    if (t.m === 0) eq += t.n;
                    else {
                        if (t.m === 1) eq += "x";
                        else if (t.m === -1) eq += "-x";
                        else eq += t.m + "x";
                        if (t.n > 0) eq += " + " + t.n;
                        else if (t.n < 0) eq += " - " + Math.abs(t.n);
                    }
                    msg.innerText = S.lang === 'KO' ?
                        `직선 ${eq}를 그리세요.` :
                        `Draw the line ${eq}.`;
                } else if (S.learnMode === 'cir') {
                    const t = S.learnTarget;
                    const getTerm = (v, char) => {
                        if (v === 0) return `${char}^2`;
                        const sign = v > 0 ? '-' : '+';
                        return `(${char} ${sign} ${Math.abs(v)})^2`;
                    };
                    const eq = `${getTerm(t.cx, 'x')} + ${getTerm(t.cy, 'y')} = ${t.r ** 2}`;
                    msg.innerHTML = S.lang === 'KO' ?
                        `원 <span id="eq-box"></span> 을(를) 그리세요.` :
                        `Draw the circle <span id="eq-box"></span>.`;
                    if (window.katex) {
                        katex.render(eq, document.getElementById('eq-box'), { throwOnError: false });
                    }
                } else if (S.learnMode === 'par_ln') {
                    msg.innerText = S.lang === 'KO' ? "점과 직선에 평행한 직선을 그리세요." : "Draw a parallel line using the point and line.";
                } else if (S.learnMode === 'perp_ln') {
                    msg.innerText = S.lang === 'KO' ? "점과 직선에 수직인 직선을 그리세요." : "Draw a perpendicular line using the point and line.";
                } else if (S.learnMode === 'mid') {
                    msg.innerText = S.lang === 'KO' ? "두 점의 중점을 찾으세요." : "Find the midpoint of the two points.";
                } else if (S.learnMode === 'bis') {
                    msg.innerText = S.lang === 'KO' ? "세 점을 이용해 각의 이등분선을 그리세요." : "Draw an angle bisector using the three points.";
                }
            };
            updateLearnUI();

            window.finishLearn = (success) => {
                const msg = document.getElementById('learn-msg');

                // Track analytics
                Analytics.trackLearningAttempt(success, S.learnShowHint);

                if (success) {
                    if (!S.learnShowHint) {
                        S.learnStreak++;
                    } else {
                        S.learnStreak = 0; // Success with hint doesn't count towards streak
                    }

                    if (S.learnStreak >= 3) {
                        msg.innerText = S.lang === 'KO' ? '참 잘했습니다! 연습을 완료했습니다.' : 'Great job! Practice completed.';
                        msg.style.background = '#27ae60';

                        // End analytics session
                        Analytics.endLearningSession(true);

                        setTimeout(() => {
                            S.objs = S.objs.filter(o => parseInt(o.id) < S.learnStartId);
                            S.idC = S.learnStartId;
                            S.learnMode = null;
                            S.learnStreak = 0;

                            // Restore hidden objects
                            S.learnHiddenObjs.forEach(id => {
                                const obj = getObj(id);
                                if (obj) obj.vis = true;
                            });
                            S.learnHiddenObjs = [];

                            msg.style.background = 'rgba(0,0,0,0.7)';
                            updateToggles(); updateLearnUI(); render();
                        }, 2000);
                    } else {
                        const countStr = ` (${S.learnStreak}/3)`;
                        msg.innerText = (S.lang === 'KO' ? '참 잘했습니다!' : 'Great job!') + countStr;
                        msg.style.background = '#27ae60';
                        setTimeout(() => {
                            regenPractice();
                            msg.style.background = 'rgba(0,0,0,0.7)';
                            updateToggles(); updateLearnUI(); render();
                        }, 1000);
                    }
                } else {
                    S.learnStreak = 0;
                    S.learnShowHint = true;
                    msg.innerText = S.lang === 'KO' ? '틀렸습니다! 힌트를 확인하세요.' : 'Incorrect! Check the hint.';
                    msg.style.background = '#e74c3c';
                    setTimeout(() => {
                        // Delete incorrect user answers, but KEEP the reference objects
                        S.objs = S.objs.filter(o => parseInt(o.id) < S.learnUserStartId);
                        S.idC = S.learnUserStartId;
                        msg.style.background = 'rgba(0,0,0,0.7)';
                        updateToggles(); updateLearnUI(); render();
                    }, 1500);
                }
            };

            updateToggles();

            document.getElementById('b-undo').onclick = undo;
            document.getElementById('b-redo').onclick = redo;

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault(); undo();
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) {
                    e.preventDefault(); redo();
                }
            });

            saveState(); // Initial snapshot
        }

        function setTool(t) {
            S.curr = t; S.pts = []; S.step = 0; S.tmp = null;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (t === 'sel') document.getElementById('b-sel').classList.add('active');
            else if (t === 'txt') document.getElementById('b-txt').classList.add('active');
            else document.getElementById('b-grp').classList.add('active');

            // Track tool usage
            if (t !== 'sel') Analytics.trackToolUsage(t);
        }

        // DRAW
        function render() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            if (S.showGrid) {
                const st = getStep(S.view.s);
                ctx.beginPath(); ctx.strokeStyle = C.GRD; ctx.lineWidth = 1;
                const tl = s2w(0, 0), br = s2w(cvs.width, cvs.height);
                const sx = Math.floor(tl.x / st) * st, ex = Math.ceil(br.x / st) * st;
                const sy = Math.floor(br.y / st) * st, ey = Math.ceil(tl.y / st) * st;
                for (let x = sx; x <= ex; x += st) { const p = w2s(x, 0); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, cvs.height); }
                for (let y = sy; y <= ey; y += st) { const p = w2s(0, y); ctx.moveTo(0, p.y); ctx.lineTo(cvs.width, p.y); }
                ctx.stroke();
            }

            const o = w2s(0, 0);

            if (S.showAxes) {
                ctx.beginPath(); ctx.strokeStyle = C.AXS; ctx.lineWidth = 2;
                ctx.moveTo(o.x, 0); ctx.lineTo(o.x, cvs.height);
                ctx.moveTo(0, o.y); ctx.lineTo(cvs.width, o.y);
                ctx.stroke();

                if (S.showTicks) {
                    const step = S.tickMode === 'pi' ? Math.PI / 2 : 1;
                    const tl = s2w(0, 0), br = s2w(cvs.width, cvs.height);
                    const startX = Math.ceil(tl.x / step) * step;
                    const endX = Math.floor(br.x / step) * step;
                    const startY = Math.ceil(br.y / step) * step;
                    const endY = Math.floor(tl.y / step) * step;

                    ctx.strokeStyle = C.AXS; ctx.lineWidth = 1;
                    ctx.fillStyle = C.AXS; ctx.font = '10px sans-serif';

                    for (let x = startX; x <= endX; x += step) {
                        if (Math.abs(x) < 1e-9) continue;
                        const p = w2s(x, 0);
                        ctx.beginPath(); ctx.moveTo(p.x, o.y - 3); ctx.lineTo(p.x, o.y + 3); ctx.stroke();
                        let lbl = S.tickMode === 'pi' ? M.formatPi(x) : Math.round(x * 10) / 10;
                        ctx.fillText(lbl, p.x - 5, o.y + 12);
                    }
                    for (let y = startY; y <= endY; y += step) {
                        if (Math.abs(y) < 1e-9) continue;
                        const p = w2s(0, y);
                        ctx.beginPath(); ctx.moveTo(o.x - 3, p.y); ctx.lineTo(o.x + 3, p.y); ctx.stroke();
                        let lbl = S.tickMode === 'pi' ? M.formatPi(y) : Math.round(y * 10) / 10;
                        ctx.fillText(lbl, o.x + 5, p.y + 4);
                    }
                }

                // Arrows & Labels
                ctx.fillStyle = C.AXS; ctx.font = '14px sans-serif';
                if (o.y >= 0 && o.y <= cvs.height) {
                    // X Axis Arrow
                    ctx.beginPath(); ctx.moveTo(cvs.width, o.y);
                    ctx.lineTo(cvs.width - 10, o.y - 5); ctx.lineTo(cvs.width - 10, o.y + 5); ctx.fill();
                }
                if (o.x >= 0 && o.x <= cvs.width) {
                    // Y Axis Arrow
                    ctx.beginPath(); ctx.moveTo(o.x, 0);
                    ctx.lineTo(o.x - 5, 10); ctx.lineTo(o.x + 5, 10); ctx.fill();
                }
                ctx.font = '12px sans-serif'; ctx.fillText('O', o.x - 15, o.y + 15);
            }

            S.objs.forEach(o => {
                // In Learning Mode, completely hide objects that were hidden at start
                if (S.learnMode && S.learnHiddenObjs.includes(o.id)) return;
                if (!o.vis && S.hovId !== o.id && !S.selIds.includes(o.id)) return;
                ctx.save(); if (!o.vis) ctx.setLineDash([5, 5]);
                drawObj(o); ctx.restore();
            });
            if (S.tmp) { ctx.save(); ctx.globalAlpha = 0.5; drawObj(S.tmp); ctx.restore(); }

            // Learning Mode Target
            if (S.learnMode === 'pt' && S.learnTarget && S.learnShowHint) {
                const p = w2s(S.learnTarget.x, S.learnTarget.y);
                ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p.x - 12, p.y); ctx.lineTo(p.x + 12, p.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p.x, p.y - 12); ctx.lineTo(p.x, p.y + 12); ctx.stroke();
            }
            if (S.learnMode === 'ln' && S.learnTarget && S.learnShowHint) {
                const { m, n, p1, p2 } = S.learnTarget;
                const sp1 = w2s(-100, m * (-100) + n), sp2 = w2s(100, m * 100 + n);
                ctx.save();
                ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(sp1.x, sp1.y); ctx.lineTo(sp2.x, sp2.y); ctx.stroke();

                // Show example points
                if (p1 && p2) {
                    ctx.setLineDash([]); ctx.globalAlpha = 0.6;
                    [p1, p2].forEach(pt => {
                        const s = w2s(pt.x, pt.y);
                        ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(s.x - 8, s.y); ctx.lineTo(s.x + 8, s.y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(s.x, s.y - 8); ctx.lineTo(s.x, s.y + 8); ctx.stroke();
                    });
                }
                ctx.restore();
            }
            if (S.learnMode === 'cir' && S.learnTarget && S.learnShowHint) {
                const { cx, cy, r, p1, p2 } = S.learnTarget;
                const p = w2s(cx, cy);
                const sr = r * S.view.s;
                ctx.save();
                ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.arc(p.x, p.y, sr, 0, Math.PI * 2); ctx.stroke();

                // Show example points (center and circumference)
                if (p1 && p2) {
                    ctx.setLineDash([]); ctx.globalAlpha = 0.6;
                    [p1, p2].forEach(pt => {
                        const s = w2s(pt.x, pt.y);
                        ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(s.x - 8, s.y); ctx.lineTo(s.x + 8, s.y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(s.x, s.y - 8); ctx.lineTo(s.x, s.y + 8); ctx.stroke();
                    });
                }
                ctx.restore();
            }
            if ((S.learnMode === 'par_ln' || S.learnMode === 'perp_ln') && S.learnTarget && S.learnShowHint) {
                const g = S.learnTarget;
                const p1 = w2s(-100, (-g.a * (-100) - g.c) / (g.b || 1));
                const p2 = w2s(100, (-g.a * 100 - g.c) / (g.b || 1));
                ctx.save();
                ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
                ctx.setLineDash([5, 5]);
                if (Math.abs(g.b) < 1e-9) {
                    const vx = -g.c / g.a;
                    const v1 = w2s(vx, -100), v2 = w2s(vx, 100);
                    ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
                ctx.restore();
            }
            if (S.learnMode === 'mid' && S.learnTarget && S.learnShowHint) {
                const p = w2s(S.learnTarget.x, S.learnTarget.y);
                ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(p.x - 10, p.y); ctx.lineTo(p.x + 10, p.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p.x, p.y - 10); ctx.lineTo(p.x, p.y + 10); ctx.stroke();
            }
            if (S.learnMode === 'bis' && S.learnTarget && S.learnShowHint) {
                const g = S.learnTarget;
                const p1 = w2s(-100, (-g.a * (-100) - g.c) / (g.b || 1));
                const p2 = w2s(100, (-g.a * 100 - g.c) / (g.b || 1));
                ctx.save();
                ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
                ctx.setLineDash([5, 5]);
                if (Math.abs(g.b) < 1e-9) {
                    const vx = -g.c / g.a;
                    const v1 = w2s(vx, -100), v2 = w2s(vx, 100);
                    ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
                ctx.restore();
            }

            updateLabels();
        }

        function drawObj(o) {
            const sel = S.selIds.includes(o.id);
            const hov = S.hovId === o.id;
            const col = sel ? C.SEL : (o.col || 'black');
            ctx.lineWidth = (sel || hov) ? (sel ? 3 : 4) : 2;
            ctx.strokeStyle = col; ctx.fillStyle = col;

            if (o.type === 'pt') {
                const p = w2s(o.x, o.y);
                ctx.beginPath(); ctx.arc(p.x, p.y, C.PT_R, 0, Math.PI * 2); ctx.fill();
                if (S.hovId === o.id) { ctx.beginPath(); ctx.arc(p.x, p.y, C.PT_R + 4, 0, Math.PI * 2); ctx.stroke(); }
            } else if (o.type === 'seg') {
                const p1 = getObj(o.p1), p2 = o.p2 ? getObj(o.p2) : o.p2_pos;
                if (p1 && p2) { const s1 = w2s(p1.x, p1.y), s2 = w2s(p2.x, p2.y); ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke(); }
            } else if (o.type === 'ln') {
                const p1 = getObj(o.p1), p2 = o.p2 ? getObj(o.p2) : o.p2_pos;
                if (p1 && p2) {
                    const dx = p2.x - p1.x, dy = p2.y - p1.y;
                    const len = Math.hypot(dx, dy);
                    if (len > 1e-9) {
                        const s1 = w2s(p1.x - dx / len * 10000, p1.y - dy / len * 10000);
                        const s2 = w2s(p1.x + dx / len * 10000, p1.y + dy / len * 10000);
                        ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
                    }
                }
            } else if (o.type === 'cir') {
                const c = getObj(o.c);
                if (c) {
                    let r = o.r;
                    if (o.mode === '2pt') r = M.dist(c, getObj(o.p2));
                    const sc = w2s(c.x, c.y);
                    ctx.beginPath(); ctx.arc(sc.x, sc.y, r * S.view.s, 0, Math.PI * 2); ctx.stroke();
                }
            } else if (o.type === 'par') {
                drawParabola(o);
            } else if (o.type === 'ell') {
                drawEllipse(o);
            } else if (o.type === 'hyp') {
                drawHyperbola(o);
            } else if (o.type === 'par_ln' || o.type === 'perp_ln' || o.type === 'bis') {
                const g = M.getGeo(o);
                if (g) {
                    const p1 = w2s(-10000, (-g.a * (-10000) - g.c) / g.b);
                    const p2 = w2s(10000, (-g.a * 10000 - g.c) / g.b);
                    if (Math.abs(g.b) < 1e-9) { // Vertical
                        const vx = -g.c / g.a;
                        const v1 = w2s(vx, -10000), v2 = w2s(vx, 10000);
                        ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.stroke();
                    } else {
                        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }
            } else if (o.type === 'mid') {
                const g = M.getGeo(o);
                if (g) {
                    const p = w2s(g.x, g.y);
                    ctx.beginPath(); ctx.arc(p.x, p.y, C.PT_R, 0, Math.PI * 2); ctx.fill();
                    if (S.hovId === o.id) { ctx.beginPath(); ctx.arc(p.x, p.y, C.PT_R + 4, 0, Math.PI * 2); ctx.stroke(); }
                }
            } else if (o.type === 'txt') {
                // No point markers for text objects as requested
            }
        }

        function drawParabola(o) {
            const f = getObj(o.p1);
            let lObj;
            if (o.l) lObj = getObj(o.l);
            else if (o.p2 && o.p3) lObj = { type: 'ln', p1: o.p2, p2: o.p3 };

            if (!f || !lObj) return;
            const d1 = getObj(lObj.p1), d2 = getObj(lObj.p2);
            if (!d1 || !d2) return;

            const l = M.line(d1, d2);
            const num = l.a * f.x + l.b * f.y + l.c;
            const den = l.a * l.a + l.b * l.b;
            const proj = { x: f.x - l.a * num / den, y: f.y - l.b * num / den };
            const V = { x: (f.x + proj.x) / 2, y: (f.y + proj.y) / 2 };
            const axis = { x: f.x - proj.x, y: f.y - proj.y };
            const p = Math.hypot(axis.x, axis.y) / 2;
            if (p < 1e-5) return;
            const ang = Math.atan2(axis.y, axis.x);
            ctx.save();
            const sV = w2s(V.x, V.y);
            ctx.translate(sV.x, sV.y);
            ctx.rotate(-ang);
            ctx.beginPath();
            const sc = S.view.s;
            // Dynamic bounds based on view scale
            // Viewport diagonal approximation in world units
            const limit = Math.max(cvs.width, cvs.height) / sc * 2 + 1000;
            const step = Math.max(1, limit / 200);

            let first = true;
            for (let t = -limit; t <= limit; t += step) {
                const lx = t * t / (4 * p);
                const ly = t;
                if (first) { ctx.moveTo(lx * sc, ly * sc); first = false; }
                else ctx.lineTo(lx * sc, ly * sc);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawEllipse(o) {
            const f1 = getObj(o.p1), f2 = getObj(o.p2), p = getObj(o.p3);
            if (!f1 || !f2 || !p) return;
            const a = (M.dist(p, f1) + M.dist(p, f2)) / 2;
            const c = M.dist(f1, f2) / 2;
            if (a <= c) return;
            const b = Math.sqrt(a * a - c * c);
            const cent = { x: (f1.x + f2.x) / 2, y: (f1.y + f2.y) / 2 };
            const ang = Math.atan2(f2.y - f1.y, f2.x - f1.x);
            const scC = w2s(cent.x, cent.y);
            ctx.beginPath();
            ctx.ellipse(scC.x, scC.y, a * S.view.s, b * S.view.s, -ang, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawHyperbola(o) {
            const f1 = getObj(o.p1), f2 = getObj(o.p2), p = getObj(o.p3);
            if (!f1 || !f2 || !p) return;
            const a = Math.abs(M.dist(p, f1) - M.dist(p, f2)) / 2;
            const c = M.dist(f1, f2) / 2;
            if (a >= c || a === 0) return;
            const b = Math.sqrt(c * c - a * a);
            const cent = { x: (f1.x + f2.x) / 2, y: (f1.y + f2.y) / 2 };
            const ang = Math.atan2(f2.y - f1.y, f2.x - f1.x);
            const sc = S.view.s;
            const scC = w2s(cent.x, cent.y);
            ctx.save();
            ctx.translate(scC.x, scC.y);
            ctx.rotate(-ang);
            ctx.beginPath();
            const limit = Math.acosh(Math.max(1, (cvs.width + cvs.height) / (a * sc || 1) + 2));
            for (let sign of [-1, 1]) {
                let first = true;
                for (let t = -limit; t <= limit; t += 0.1) {
                    const lx = sign * a * Math.cosh(t);
                    const ly = b * Math.sinh(t);
                    if (first) { ctx.moveTo(lx * sc, ly * sc); first = false; }
                    else ctx.lineTo(lx * sc, ly * sc);
                }
            }
            ctx.stroke();
            ctx.restore();
        }

        function updateLabels() {
            const div = document.getElementById('ui');
            div.innerHTML = '';

            // Fixed Pixel Offset Logic
            // Using C.PT_R + 8 as base offset
            const off = C.PT_R + 8;

            S.objs.forEach(o => {
                // In Learning Mode, hide labels for hidden objects
                if (S.learnMode && S.learnHiddenObjs.includes(o.id)) return;
                if (!o.vis) return;
                let p = { x: o.x, y: o.y };
                if (o.type !== 'pt' && o.type !== 'txt') { const c = getCenter(o); if (!c) return; p = c; }

                const s = w2s(p.x, p.y);

                // Culling
                if (s.x < -50 || s.x > cvs.width + 50 || s.y < -50 || s.y > cvs.height + 50) return;

                const el = document.createElement('div');
                el.className = 'label';
                if (o.type === 'txt') {
                    el.classList.add('txt-obj');
                    if (S.selIds.includes(o.id) || S.hovId === o.id) el.classList.add('selected');
                    // No offset for centered text boxes
                    el.style.left = s.x + 'px';
                    el.style.top = s.y + 'px';
                } else {
                    // Apply fixed pixel offset for point labels
                    el.style.left = (s.x + off) + 'px';
                    el.style.top = (s.y + off) + 'px';
                }

                // Show Name if selected, otherwise Caption (for txt, always show Caption)
                let txt = (o.type !== 'txt' && S.selIds.includes(o.id)) ? o.name : o.cap;
                if (['ln', 'seg', 'par', 'ell', 'hyp'].includes(o.type)) {
                    const eq = M.getEquation(o);
                    txt = eq ? `$${o.name}: ${eq}$` : `$${o.name}$`;
                }
                el.innerText = txt;

                if (window.renderMathInElement) {
                    renderMathInElement(el, {
                        delimiters: [
                            { left: "$$", right: "$$", display: true },
                            { left: "$", right: "$", inline: true }
                        ],
                        throwOnError: false
                    });
                }

                div.appendChild(el);
            });

            // Axis Labels (Latex)
            if (S.showAxes) {
                const o = w2s(0, 0);
                if (o.y >= 0 && o.y <= cvs.height) {
                    const xL = document.createElement('div');
                    xL.className = 'label'; xL.style.left = (cvs.width - 20) + 'px'; xL.style.top = (o.y + 10) + 'px';
                    xL.innerHTML = '$x$';
                    if (window.katex) katex.render('x', xL, { throwOnError: false });
                    div.appendChild(xL);
                }
                if (o.x >= 0 && o.x <= cvs.width) {
                    const yL = document.createElement('div');
                    yL.className = 'label'; yL.style.left = (o.x + 10) + 'px'; yL.style.top = '5px';
                    yL.innerHTML = '$y$';
                    if (window.katex) katex.render('y', yL, { throwOnError: false });
                    div.appendChild(yL);
                }
            }
        }

        function getCenter(o) {
            if (o.type === 'seg' || o.type === 'ln') { const p1 = getObj(o.p1), p2 = getObj(o.p2); return p1 && p2 ? { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 } : null; }
            if (o.type === 'cir') return getObj(o.c);
            return null;
        }

        function getStep(s) {
            let raw = 50 / s, p = Math.floor(Math.log10(raw)), b = Math.pow(10, p);
            return raw / b > 5 ? b * 5 : (raw / b > 2 ? b * 2 : b);
        }

        init();

    </script>
